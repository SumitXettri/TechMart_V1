version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: techmart
      POSTGRES_PASSWORD: techmart
      POSTGRES_DB: techmart_dev
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  socket-server:
    build: .
    command: node server/socket-server.js
    depends_on:
      - redis
    environment:
      - SOCKET_PORT=4000

  worker:
    build: .
    command: node server/worker.js
    depends_on:
      - redis
      - postgres
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://techmart:techmart@postgres:5432/techmart_dev

volumes:
  db-data:
