name: E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: techmart
          POSTGRES_PASSWORD: techmart
          POSTGRES_DB: techmart_dev
        options: >-
          --health-cmd="pg_isready -U techmart" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Push Prisma schema
        env:
          DATABASE_URL: postgresql://techmart:techmart@localhost:5432/techmart_dev
        run: npx prisma db push --accept-data-loss

      - name: Seed database
        env:
          DATABASE_URL: postgresql://techmart:techmart@localhost:5432/techmart_dev
        run: npm run seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E
        env:
          BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://techmart:techmart@localhost:5432/techmart_dev
        run: |
          npm run dev > /tmp/techmart-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 2
          done
          npx playwright test --reporter=list
